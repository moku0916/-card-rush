<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CARD RUSH</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="app">

<header>

<h1>🏇 CARD RUSH</h1>

<p class="subTitle">

Horse Racing Board Game

</p>

</header>

<!-- ========================= -->
<!-- タイトル画面 -->
<!-- ========================= -->

<section id="titleScreen" class="screen">

<h2>メインメニュー</h2>

<button id="startButton">
🏇 レース開始
</button>

<button id="cardBookButton">
📖 カード図鑑
</button>

<button id="courseBookButton">
🏆 コース図鑑
</button>

<button id="settingButton">
⚙️ 設定
</button>

</section>

<!-- ========================= -->
<!-- レース画面 -->
<!-- ========================= -->

<section id="raceScreen" class="screen hidden">

<h2 id="courseName">

コース抽選中...

</h2>

<div id="raceInfo">

<div id="weather">
天候：
</div>

<div id="pace">
ペース：
</div>

<div id="phase">
フェーズ0
</div>

</div>

<div id="horseArea">

</div>

<div id="logArea">

レース準備中...

</div>

<div id="raceButtons">

<button id="nextButton">

次へ

</button>

<button id="menuButton">

メニュー

</button>

</div>

</section>

<!-- ========================= -->
<!-- 馬カード図鑑 -->
<!-- ========================= -->

<section id="cardBookScreen"

class="screen hidden">

<h2>

カード図鑑

</h2>

<div id="cardList">

カードがここに表示されます。

</div>

<button class="backButton">

←戻る

</button>

</section>

<!-- ========================= -->
<!-- コース図鑑 -->
<!-- ========================= -->

<section id="courseBookScreen"

class="screen hidden">

<h2>

GIコース図鑑

</h2>

<div id="courseList">

コースカードがここに表示されます。

</div>

<button class="backButton">

←戻る

</button>

</section>

<!-- ========================= -->
<!-- 設定 -->
<!-- ========================= -->

<section id="settingScreen"

class="screen hidden">

<h2>

設定

</h2>

<p>

BGM

<select id="bgm">

<option>ON</option>

<option>OFF</option>

</select>

</p>

<p>

演出速度

<select id="speed">

<option>普通</option>

<option>速い</option>

<option>最速</option>

</select>

</p>

<button class="backButton">

←戻る

</button>

</section>

</div>

<!-- メイン -->

<script src="game.js"></script>

<!-- データ -->

<script src="horses.js"></script>

<script src="courses.js"></script>

<!-- エンジン -->

<script src="race.js"></script>

<script src="ability.js"></script>

<script src="event.js"></script>

<script src="odds.js"></script>

<script src="ai.js"></script>

</body>

</html>
